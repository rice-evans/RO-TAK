const sha256hex = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(x => x.toString(16).padStart(2, '0')).join('');
const rndKey = () => { const a = new Uint8Array(16); crypto.getRandomValues(a); return [...a].map(x => x.toString(16).padStart(2, '0')).join(''); };
const hostKeyOf = c => { try { return localStorage.getItem('atak-host-' + c) || ''; } catch (e) { return ''; } };
const clientId = Math.random().toString(36).slice(2);
const decorAvs = $('avs').innerHTML;

const uuid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));

function db() {
  if (!sb) sb = createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: false, autoRefreshToken: false },
    realtime: { transport: WebSocket },
    global: { fetch: (u, o) => { if (!myKey) return fetch(u, o); const h = new Headers((o && o.headers) || {}); h.set('x-host-key', myKey); return fetch(u, Object.assign({}, o, { headers: h })); } },
  });
  return sb;
}

function showErr(msg) {
  const e = $('joinErr');
  e.textContent = msg || '';
  e.style.display = msg ? 'block' : 'none';
}
function fail(err) {
  const lm = err && err.message;
  if (typeof lm === 'string' && /locked|only the host/i.test(lm)) { toast(lm); syncRoom().catch(() => {}); return; }
  showErr((err && err.message) || String(err));
  $('title').textContent = 'SYNC ERROR';
  clearTimeout(errTimer);
  errTimer = setTimeout(setTitle, 4000);
}

function confirmTap(id, fn) {
  const b = $('b-' + id);
  if (b.classList.contains('arm')) { b.classList.remove('arm'); fn(); return; }
  b.classList.add('arm');
  setTimeout(() => b.classList.remove('arm'), 3000);
}

const num = n => typeof n === 'number' && isFinite(n);
const pt = p => Array.isArray(p) && p.length === 2 && num(p[0]) && num(p[1]);
function cleanOpts(o) {
  const r = {};
  if (!o || typeof o !== 'object') return r;
  TEXT_KEYS.forEach(([k]) => { const v = o[k]; if (typeof v === 'string' || typeof v === 'number') { const t = String(v).slice(0, 60); if (t) r[k] = t; } });
  if (COLOR_MODES.some(c => c[0] === o.colorMode)) r.colorMode = o.colorMode;
  ['fill', 'frame', 'icon'].forEach(k => { if (typeof o[k] === 'boolean') r[k] = o[k]; });
  if (Number.isInteger(o.stack) && o.stack >= 1 && o.stack <= 6) r.stack = o.stack;
  if (RR.some(x => x[0] === o.reinforcedReduced)) r.reinforcedReduced = o.reinforcedReduced;
  return r;
}
function cleanItem(d, id) {
  const it = cleanItemRaw(d, id);
  if (!it) return null;
  const vals = [it.n, it.t]; if (it.o) Object.keys(it.o).forEach(k => vals.push(typeof it.o[k] === 'string' ? it.o[k] : ''));
  return vals.some(v => isBad(v)) ? null : it;
}
function cleanItemRaw(d, id) {
  if (!d || typeof d !== 'object' || typeof id !== 'string') return null;
  const color = typeof d.color === 'string' && /^#[0-9a-f]{3,8}$/i.test(d.color) ? d.color : '#ff7a1a';
  if (d.type === 'pen') {
    if (!Array.isArray(d.pts) || !d.pts.length || d.pts.length > 5000 || !d.pts.every(pt) || !num(d.w)) return null;
    return { id, type: 'pen', color, w: d.w, pts: d.pts };
  }
  if (d.type === 'line' || d.type === 'box' || d.type === 'arrow') {
    if (!pt(d.a) || !pt(d.b) || !num(d.w)) return null;
    return { id, type: d.type, color, w: d.w, a: d.a, b: d.b };
  }
  if (d.type === 'sym') {
    const okS = typeof d.sidc === 'string' && (/^\d{20}$/.test(d.sidc) || /^[A-Z][A-Z-]{3}[A-Z0-9-]{11}$/.test(d.sidc));
    if (!okS || !num(d.x) || !num(d.y) || !num(d.s) || d.s <= 0 || d.s > 100000) return null;
    return { id, type: 'sym', sidc: d.sidc, std: d.std === 'APP6' ? 'APP6' : '2525', o: cleanOpts(d.o), x: d.x, y: d.y, s: d.s };
  }
  if (d.type === 'wp') {
    if (typeof d.n !== 'string' || !d.n.trim() || !num(d.x) || !num(d.y)) return null;
    return { id, type: 'wp', color, n: d.n.slice(0, 24), x: d.x, y: d.y };
  }
  if (d.type === 'timer') {
    if (typeof d.n !== 'string' || !num(d.d) || d.d < 1 || d.d > 86400 || !num(d.end) || d.end < 0 || !num(d.left) || d.left < 0 || d.left > 86400) return null;
    return { id, type: 'timer', color, n: d.n.slice(0, 24), d: d.d, end: d.end, left: d.left };
  }
  if (d.type === 'num') {
    if (typeof d.n !== 'string' || !d.n || !num(d.x) || !num(d.y)) return null;
    return { id, type: 'num', color, n: d.n.slice(0, 8), x: d.x, y: d.y };
  }
  if (d.type === 'text') {
    if (typeof d.t !== 'string' || !num(d.x) || !num(d.y) || !num(d.fs)) return null;
    return { id, type: 'text', color, t: d.t.slice(0, 200), x: d.x, y: d.y, fs: d.fs };
  }
  return null;
}

let lkT = 0;
function lockedOut() {
  if (!ro()) return false;
  if (Date.now() - lkT > 1500) { lkT = Date.now(); toast('Room is locked'); setTimeout(() => syncRoom().catch(() => {}), 50); }
  return true;
}
function pushAdd(list) {
  if (!room || lockedOut()) return;
  const rows = (Array.isArray(list) ? list : [list]).map(it => ({ id: it.id, room, data: it }));
  if (rows.length) db().from('marks').upsert(rows, { onConflict: 'id', ignoreDuplicates: true }).then(r => r.error && fail(r.error));
}
function pushUpd(it) {
  if (!room || lockedOut()) return;
  db().from('marks').update({ data: it }).eq('id', it.id).then(r => r.error && fail(r.error));
}
function pushDel(ids) {
  if (!room || !ids.length || lockedOut()) return;
  db().from('marks').delete().in('id', ids).then(r => r.error && fail(r.error));
}
function pushClear() {
  if (!room || lockedOut()) return;
  db().from('marks').delete().eq('room', room).then(r => r.error && fail(r.error));
}

function onInsert(row) {
  if (!row || items.some(i => i.id === row.id)) return;
  const it = cleanItem(row.data, row.id);
  if (it) { items.push(it); draw(); }
}
function onUpdate(row) {
  if (!row) return;
  const it = items.find(i => i.id === row.id);
  if (!it || (drag && drag.it === it)) return;
  const n = cleanItem(row.data, row.id);
  if (n) { for (const k in it) delete it[k]; Object.assign(it, n); draw(); }
}
function onDelete(old) {
  if (!old) return;
  const i = items.findIndex(x => x.id === old.id);
  if (i > -1) { items.splice(i, 1); draw(); }
}
function onRoom(r) {
  if (!r) return;
  roomHasMap = !!r.map_path;
  if ('locked' in r && r.locked !== roomLocked) { roomLocked = !!r.locked; setTitle(); roomUI(); }
  if ('credit' in r) setCredit(r.credit);
  if ('grid' in r) setGrid(r.grid, true);
  if (r.map_path && r.map_path !== curPath) { hist = []; showRemoteMap(r.map_path); }
}
function showRemoteMap(path) {
  if (typeof path !== 'string' || !/^[a-z0-9-]+\/[0-9]+\.[a-z0-9]+$/i.test(path)) return;
  curPath = path;
  const { data } = db().storage.from('maps').getPublicUrl(path);
  setImg(data.publicUrl, { fit: true });
}

async function syncRoom() {
  const r = await db().from('rooms').select('*').eq('code', room).single();
  if (r.error) throw r.error;
  roomHasMap = !!r.data.map_path;
  hostHash = r.data.host_hash || null; roomLocked = !!r.data.locked; isHost = !!(hostHash && myHash && hostHash === myHash);
  if (isHost) { try { localStorage.setItem('atak-host-' + room, myKey); } catch (e) {} }
  setTitle(); roomUI();
  setCredit(r.data.credit);
  if ('grid' in r.data) setGrid(r.data.grid, true);
  if (r.data.map_path && r.data.map_path !== curPath) showRemoteMap(r.data.map_path);
  const m = await db().from('marks').select('id,data').eq('room', room).order('created_at').limit(5000);
  if (m.error) throw m.error;
  items = m.data.map(x => cleanItem(x.data, x.id)).filter(Boolean);
  hist = [];
  draw();
}

async function shrinkImage(f) {
  if (f.size <= 10e6) return f;
  const bmp = await createImageBitmap(f), k = Math.min(1, 4096 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.88));
  return b ? new File([b], 'map.jpg', { type: 'image/jpeg' }) : f;
}
async function uploadMap(f, cr) {
  showErr('');
  const my = room;
  try { f = await shrinkImage(f); } catch (e) {}
  if (f.size > 12e6) return showErr('Image is too large (12 MB max)');
  toast('Checking image...');
  let out;
  try {
    const fd = new FormData(); fd.append('room', room); fd.append('file', f);
    const r = await fetch(SUPABASE_URL + '/functions/v1/upload-map', { method: 'POST', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }, body: fd });
    out = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(out.error || 'Upload failed');
  } catch (e) { toast(e.message || 'Upload failed'); return showErr(e.message || 'Upload failed'); }
  if (room !== my) return;
  toast('Map uploaded');
  const path = out.path;
  curPath = path; roomHasMap = true;
  items = []; hist = [];
  setImg(URL.createObjectURL(f), { fit: true });
  const d = await db().from('marks').delete().eq('room', room);
  if (d.error) fail(d.error);
  setCredit(cr || null); setGrid(null, true);
  let u = await db().from('rooms').update({ map_path: path, credit: cr ? JSON.stringify(cr) : null, grid: null }).eq('code', room);
  if (u.error && /credit|grid/i.test(u.error.message || '')) u = await db().from('rooms').update({ map_path: path }).eq('code', room);
  if (u.error) fail(u.error);
}

function hue(str) { let h = 0; for (const ch of str) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; }
function renderPresence(state) {
  const box = $('avs');
  if (!state) { box.innerHTML = decorAvs; return; }
  const people = Object.values(state).map(a => a[0] && a[0].name).filter(n => typeof n === 'string' && n).map(n => isBad(n) ? 'Player' : n);
  box.textContent = '';
  const add = (text, bg, title) => {
    const d = document.createElement('div');
    d.className = 'av'; d.style.background = bg; d.textContent = text;
    if (title) d.title = title;
    box.appendChild(d);
  };
  people.slice(0, 4).forEach(n => add(n.slice(0, 1).toUpperCase(), 'hsl(' + hue(n) + ',55%,42%)', n));
  if (people.length > 4) add('+' + (people.length - 4), '#333');
}

let wake = null;
async function keepAwake() {
  try {
    if (IS_ELECTRON || !room || !navigator.wakeLock || wake) return;
    wake = await navigator.wakeLock.request('screen');
    wake.addEventListener('release', () => { wake = null; });
  } catch (e) {}
}
function releaseAwake() { try { if (wake) wake.release(); } catch (e) {} wake = null; }
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && room) { syncRoom().catch(fail); keepAwake(); }
});
document.addEventListener('gesturestart', e => e.preventDefault());

function setJoinedUI(on) {
  $('joinBtn').textContent = on ? 'Leave' : 'Join';
  $('joinBtn').classList.toggle('leave', on);
  $('roomIn').readOnly = on;
  $('nameIn').readOnly = on;
}
let hbTimer = null;
function touchRoom() { if (room) db().from('rooms').update({ last_active: new Date().toISOString() }).eq('code', room).then(() => {}, () => {}); }
function teardown() {
  clearInterval(hbTimer); hbTimer = null;
  if (channel) { try { db().removeChannel(channel); } catch (e) {} channel = null; }
}

async function joinRoom(code, nick) {
  const rawCode = String(code || '');
  code = rawCode.trim().toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 24).replace(/-$/, '');
  nick = String(nick || '').slice(0, 16) || 'Player' + Math.floor(100 + Math.random() * 900);
  if (!code) return showErr('Enter a room code');
  if (isBad(rawCode) || isBad(code) || isBad(nick)) return showErr('That name or room code is not allowed');
  await libReady;
  if (!createClient) return showErr('Could not load sync library');
  if (!/^https:\/\//.test(SUPABASE_URL) || !SUPABASE_KEY) return showErr('Server not set');
  teardown();
  myNick = nick; pings = [];
  room = code; curPath = null; roomHasMap = false; hostHash = null; roomLocked = false; isHost = false; myKey = ''; myHash = ''; roomUI(); setCredit(null); loadGridLocal();
  items = []; hist = []; img = null; v = { x: 0, y: 0, s: 1, r: 0 };
  $('roomIn').value = code.replace(/-/g, ' '); $('nameIn').value = nick;
  setJoinedUI(true); showErr(''); setTitle(); draw();
  try { localStorage.setItem('atak-room', JSON.stringify({ code, name: nick })); localStorage.setItem('atak-name', nick); } catch (e) {}
  if (!IS_ELECTRON && /^\/play/.test(location.pathname)) { try { history.replaceState(null, '', '/play?room=' + encodeURIComponent(code)); } catch (e) {} }
  try {
    try { myKey = hostKeyOf(code) || rndKey(); myHash = await sha256hex(myKey); } catch (e) { myKey = ''; myHash = ''; }
    let up = await db().from('rooms').upsert(myHash ? { code, host_hash: myHash } : { code }, { onConflict: 'code', ignoreDuplicates: true });
    if (up.error && /host_hash/i.test(up.error.message || '')) up = await db().from('rooms').upsert({ code }, { onConflict: 'code', ignoreDuplicates: true });
    if (up.error) throw up.error;
    if (room !== code) return;
    touchRoom(); hbTimer = setInterval(touchRoom, 300000);
    channel = db().channel('atak:' + code, { config: { presence: { key: clientId } } });
    channel
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'marks', filter: 'room=eq.' + code }, p => onInsert(p.new))
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'marks', filter: 'room=eq.' + code }, p => onUpdate(p.new))
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'marks' }, p => onDelete(p.old))
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rooms', filter: 'code=eq.' + code }, p => onRoom(p.new))
      .on('broadcast', { event: 'ping' }, m => onPing(m && m.payload))
      .on('presence', { event: 'sync' }, () => renderPresence(channel.presenceState()))
      .subscribe(async (st, err) => {
        if (room !== code) return;
        if (st === 'SUBSCRIBED') {
          channel.track({ name: nick });
          keepAwake();
          try { await syncRoom(); } catch (e) { fail(e); }
        } else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') {
          fail(err || new Error('Connection failed'));
        }
      });
  } catch (e) { fail(e); }
}

function leaveRoom() {
  teardown();
  releaseAwake();
  pings = [];
  room = null; curPath = null; roomHasMap = false; hostHash = null; roomLocked = false; isHost = false; myKey = ''; myHash = ''; roomUI();
  try { localStorage.removeItem('atak-room'); } catch (e) {}
  if (!IS_ELECTRON && /^\/play/.test(location.pathname)) { try { history.replaceState(null, '', '/play'); } catch (e) {} }
  setJoinedUI(false); showErr(''); renderPresence(null);
  items = []; hist = []; img = null; name = 'RO-TAK'; v = { x: 0, y: 0, s: 1, r: 0 };
  load(); setTitle(); draw();
}

$('joinBtn').onclick = () => room ? leaveRoom() : joinRoom($('roomIn').value, $('nameIn').value.trim());
['roomIn', 'nameIn'].forEach(id => $(id).addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter' && !room) $('joinBtn').click();
}));

function tick() {
  const d = new Date();
  $('clock').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
}
setInterval(tick, 10000); tick();

if (IS_ELECTRON) window.rotak.onLocked(l => $('case').classList.toggle('locked', l));

let dragging = false;
function stopDrag() { if (dragging) { dragging = false; window.rotak.send('drag-end'); } }
$('case').addEventListener('mousedown', e => {
  if (!IS_ELECTRON || e.button !== 0 || e.target.closest('#stage')) return;
  dragging = true;
  window.rotak.send('drag-start');
});
addEventListener('mouseup', stopDrag);
addEventListener('blur', stopDrag);

if (IS_ELECTRON) $('frame').src = 'frame.png';
new ResizeObserver(() => document.documentElement.style.setProperty('--tb', $('toolbar').offsetHeight + 'px')).observe($('toolbar'));
if (!IS_ELECTRON && 'serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
paintColor(); paintSize(); setTool('pen');
load();
resize();
try {
  $('nameIn').value = localStorage.getItem('atak-name') || ('Player' + Math.floor(100 + Math.random() * 900));
  const r = JSON.parse(localStorage.getItem('atak-room') || 'null');
  const q = !IS_ELECTRON && new URLSearchParams(location.search).get('room');
  if (q) joinRoom(q, $('nameIn').value);
  else if (r && r.code) joinRoom(r.code, $('nameIn').value);
} catch (e) {}
