name: Build desktop app
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copy shared app files
        shell: bash
        run: cp index.html milsymbol.js symdata.js desktop/
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Install
        working-directory: desktop
        run: npm install
      - name: Build and upload to the release
        working-directory: desktop
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
      - name: Write checksums
        shell: bash
        working-directory: desktop/dist
        run: |
          node -e "const fs=require('fs'),c=require('crypto');const out=fs.readdirSync('.').filter(f=>/\.(dmg|exe)$/.test(f)).map(f=>c.createHash('sha256').update(fs.readFileSync(f)).digest('hex')+'  '+f).join('\n')+'\n';fs.writeFileSync('SHA256SUMS-'+process.env.RUNNER_OS+'.txt',out);console.log(out)"
      - name: Attach checksums to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop/dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name==\"$GITHUB_REF_NAME\") | .id" | head -n1)
          gh api --method POST "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$id/assets?name=SHA256SUMS-$RUNNER_OS.txt" -H "Content-Type: text/plain" --input "SHA256SUMS-$RUNNER_OS.txt"
